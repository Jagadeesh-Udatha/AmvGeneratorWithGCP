<style>

.tl-bpm{font-size:10px;font-weight:700;color:var(--accent2);background:var(--glowS);padding:2px 8px;border-radius:10px}
.mkcard{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:11px;transition:border .15s}.mkcard:hover{border-color:var(--borderH)}.mkcard-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px}.mkcard-desc{font-size:9px;color:var(--text3);line-height:1.5;margin:3px 0}
.vote-btn{background:none;border:1px solid var(--border2);border-radius:5px;color:var(--text3);font-size:9px;padding:2px 8px;cursor:pointer;font-family:'DM Sans';transition:all .15s}.vote-btn:hover{border-color:var(--accent);color:var(--accent2)}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.cat-tab{padding:3px 10px;border:1px solid var(--border2);border-radius:20px;font-size:9px;font-weight:600;cursor:pointer;color:var(--text3);background:none;font-family:'DM Sans';transition:all .15s}.cat-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}.cat-tab:hover:not(.on){border-color:var(--accent);color:var(--accent2)}
.plan-scenes{display:flex;flex-direction:column;gap:7px;margin-top:8px}.plan-scene{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}.plan-scene-header{display:flex;align-items:center;gap:8px;margin-bottom:5px}.plan-scene-num{font-size:9px;font-weight:700;color:var(--accent2);min-width:18px}.plan-inp{width:100%;padding:5px 8px;background:var(--surface);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-size:10px;font-family:'DM Sans';outline:none}.plan-inp:focus{border-color:var(--accent)}.plan-ta{resize:none;min-height:38px;line-height:1.5}
.audio-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.audio-bar button{background:var(--accent);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.audio-bar button:hover{background:var(--accentD)}
.audio-bar .audio-time{font-size:10px;color:var(--text3);font-weight:600;min-width:70px;text-align:center}
.audio-bar .audio-seek{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer}.audio-bar .audio-seek::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--pink);cursor:pointer}
.audio-bar .audio-vol{width:60px;-webkit-appearance:none;height:3px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer}.audio-bar .audio-vol::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:var(--accent);cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes cellpulse{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.4)}50%{box-shadow:0 0 0 4px rgba(139,92,246,0)}}@keyframes genPulse{0%,100%{box-shadow:0 0 30px rgba(139,92,246,.3)}50%{box-shadow:0 0 60px rgba(236,72,153,.3)}}
.spinning{animation:spin 1s linear infinite;display:inline-block}.pulsing{animation:pulse 1.5s ease-in-out infinite}.fade-in{animation:fadeIn .3s ease}.gen-pulse{animation:genPulse 2s ease-in-out infinite}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const API="http://localhost:4000";
const EMOTION_META={hype:{color:"#f87171",icon:"⚡",label:"Hype"},triumphant:{color:"#fbbf24",icon:"🏆",label:"Epic"},sad:{color:"#60a5fa",icon:"💙",label:"Sad"},romantic:{color:"#f472b6",icon:"💗",label:"Romantic"},neutral:{color:"#a78bfa",icon:"✦",label:"Neutral"}};
/* COMPOSITION REGISTRY — exact mirror of backend COMPOSITIONS set (22 total).
   Removed: three_panel, film_strip, quad_grid, diagonal_split (panel complexity),
            vertical_wipe (fragile cover-crop), parallax (complex coordinate system),
            triptych_reveal (14-segment filter graph, too heavy). */
const COMP_CATEGORIES={
  all:{label:"All",compositions:[]},
  reveals:{label:"Reveals",compositions:["character_reveal","swipe_in_left","swipe_in_right","swipe_in_top","curtain_open"]},
  focus:{label:"Focus",compositions:["spotlight_zoom","neon_frame","vhs_composite"]},
  impact:{label:"Impact",compositions:["impact_frame","bounce_zoom","zoom_burst","shockwave"]},
  multi:{label:"Multi",compositions:["beat_stack_3","door_open","photo_wall_sweep","pip_corner"]}
};
const COMP_DESCRIPTIONS={
  character_reveal:"Punch zoom 3× → 1× easeOutCubic",
  swipe_in_left:"Enters from left — easeOutCubic settle",
  swipe_in_right:"Enters from right — easeOutCubic settle",
  swipe_in_top:"Drops from top — easeOutCubic settle",
  curtain_open:"Black curtains slide apart — reveals image",
  spotlight_zoom:"Blurred bg + sharp fg zooms in + drifts",
  neon_frame:"Cyan/magenta border + slow zoom",
  vhs_composite:"VHS jitter + chromatic aberration + noise",
  impact_frame:"White flash + 2.2× punch-zoom",
  bounce_zoom:"Damped spring oscillation",
  zoom_burst:"Fast zoom-in power deceleration",
  shockwave:"Exponential decay zoom + vignette pulse",
  beat_stack_3:"3 horizontal strips slide up on beats",
  door_open:"Door panels slide apart revealing bg",
  photo_wall_sweep:"2×2 image wall — camera pan sweep",
  pip_corner:"Full frame + PIP slides in from right"
};

// ─── SHARED EASING (mirrors animationContract.js exactly) ─────────────────────
const Easing={
  easeOutCubic:  p=>1-Math.pow(1-Math.min(1,Math.max(0,p)),3),
  easeInCubic:   p=>Math.pow(Math.min(1,Math.max(0,p)),3),
  easeInOutCubic:p=>{p=Math.min(1,Math.max(0,p));return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;},
  spring:        p=>{p=Math.min(1,Math.max(0,p));return 1-Math.exp(-6*p)*Math.cos(12*p);},
  linear:        p=>Math.min(1,Math.max(0,p)),
};
function easingAt(name,p){return(Easing[name]||Easing.easeOutCubic)(p);}
function lerpVal(a,b,p,easing){return a+(b-a)*easingAt(easing,p);}

// ─── COMPOSITION KEYFRAME STRIP ────────────────────────────────────────────────
// Renders a compact horizontal timeline showing animation layers for selected composition.
// Uses the SAME contract data that animationContract.js provides to FFmpeg.
function CompositionKeyframeStrip({composition,duration,beatOffsets}){
  const W=280,H=56;
  const ref=useRef(null);
  const contract=useMemo(()=>{
    if(!composition||!COMP_DESCRIPTIONS[composition])return null;
    // Build inline contracts matching animationContract.js getContracts()
    const dur=duration||2;
    const w=1080,h=1920;
    const swD=Math.min(0.45,dur*0.38);
    const opD=Math.min(0.70,dur*0.50);
    const rvD=Math.min(1.0,dur*0.65);
    const beats=beatOffsets||[];
    const b0=beats[0]||0,b1=beats[1]||(dur*0.33),b2=beats[2]||(dur*0.66);
    const contracts={
      character_reveal:[{t:"zoom",tg:"main",s:0,d:dur,e:"easeOutCubic",fSc:3.0,toSc:1.02,col:"#ef4444"}],
      swipe_in_left:[{t:"trans",tg:"main",s:0,d:swD,e:"easeOutCubic",fX:-w,toX:0,col:"#22c55e"},{t:"zoom",tg:"main",s:0,d:dur,e:"easeInOutCubic",fSc:1.0,toSc:1.06,col:"#8b5cf6"}],
      swipe_in_right:[{t:"trans",tg:"main",s:0,d:swD,e:"easeOutCubic",fX:w,toX:0,col:"#22c55e"},{t:"zoom",tg:"main",s:0,d:dur,e:"easeInOutCubic",fSc:1.0,toSc:1.06,col:"#8b5cf6"}],
      swipe_in_top:[{t:"trans",tg:"main",s:0,d:swD,e:"easeOutCubic",fY:-h,toY:0,col:"#22c55e"},{t:"zoom",tg:"main",s:0,d:dur,e:"easeInOutCubic",fSc:1.0,toSc:1.06,col:"#8b5cf6"}],
      curtain_open:[{t:"zoom",tg:"img",s:0,d:dur,e:"easeInOutCubic",fSc:1.02,toSc:1.08,col:"#8b5cf6"},{t:"trans",tg:"L-curtain",s:0,d:opD,e:"easeOutCubic",fX:0,toX:-w/2,col:"#64748b"},{t:"trans",tg:"R-curtain",s:0,d:opD,e:"easeOutCubic",fX:w/2,toX:w,col:"#94a3b8"}],

function MarketplaceTab(){

      {showForm&&(<div className="card" style={{marginBottom:16}}><div className="clabel">📝 Submit</div><div className="row2"><div className="field"><label className="lbl">Name</label><input className="inp" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div><div className="field"><label className="lbl">Slug</label><input className="inp" value={form.slug} onChange={e=>setForm(f=>({...f,slug:e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,'_')}))}/></div></div><div className="row2"><div className="field"><label className="lbl">Category</label><select className="sel" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>{cats.filter(c=>c!=="all").map(c=><option key={c} value={c}>{c}</option>)}</select></div><div className="field"><label className="lbl">Description</label><input className="inp" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))}/></div></div><div className="field"><label className="lbl">FFmpeg Template</label><textarea className="ta" rows={5} value={form.ffmpegTemplate} onChange={e=>setForm(f=>({...f,ffmpegTemplate:e.target.value}))}/></div><button className="btn btn-p" onClick={submitComposition} disabled={submitting||!form.name||!form.slug||!form.ffmpegTemplate}>{submitting?"⏳":"🚀 Submit"}</button></div>)}

function App(){
  const [tab,setTab]=useState("amv");const [health,setHealth]=useState(null);const [beatOk,setBeatOk]=useState(null);const [history,setHist]=useState([]);const [error,setErr]=useState(null);const [options,setOptions]=useState(null);
  const [audioFile,setAF]=useState(null);const [mediaFiles,setMF]=useState([]);const [beatData,setBD]=useState(null);const [analyzing,setAna]=useState(false);const [sensitivity,setSens]=useState(0.5);const [editStyle,setEditStyle]=useState(null);const [ar,setAR]=useState("9:16");const [maxDur,setMaxDur]=useState(30);const [generating,setGen]=useState(false);const [genStep,setGStep]=useState(-1);const [genProg,setGProg]=useState(0);const [genResult,setGRes]=useState(null);const [classifierInfo,setClassInfo]=useState(null);const [dbStats,setDbStats]=useState(null);
  const [currentJobId,setJobId]=useState(null);const [jobMode,setJobMode]=useState("idle");
  const [editorMode,setEditor]=useState(false);const [sessionId,setSid]=useState(null);const [scenes,setScenes]=useState([]);const [totalDur,setTDur]=useState(30);const [audioUrl,setAudioUrl]=useState(null);
  const [autoExporting,setAutoExporting]=useState(false);
  const sessionReadyRef=useRef(false);
  const [prompt,setPrompt]=useState("");const [aiDur,setAiDur]=useState(15);const [voice,setVoice]=useState("male_en");const [inclAudio,setIA]=useState(true);const [inclSubs,setIS]=useState(true);const [planning,setPlan]=useState(false);const [plan,setPlanData]=useState(null);const [aiGenerating,setAIG]=useState(false);const [aiStep,setAIStep]=useState(-1);const [aiProg,setAIProg]=useState(0);const [aiResult,setAIRes]=useState(null);

  // BYOK API keys (stored in localStorage, never sent to DB)

  function saveByok(){localStorage.setItem('byok_anthropic',byokAnthropic);localStorage.setItem('byok_gemini',byokGemini);localStorage.setItem('byok_openai',byokOpenai);setShowSettings(false);}

  useEffect(()=>{fetch(API+"/health").then(r=>r.json()).then(setHealth).catch(()=>{});fetch(API+"/api/video/list").then(r=>r.json()).then(d=>setHist(d.videos||[])).catch(()=>{});fetch(API+"/api/amv/model-info").then(r=>r.json()).then(d=>setClassInfo(d.classifier)).catch(()=>{});fetch(API+"/api/amv/db-stats").then(r=>r.json()).then(d=>setDbStats(d.stats)).catch(()=>{});fetch(API+"/api/amv/options").then(r=>r.json()).then(setOptions).catch(()=>{});fetch("http://localhost:5051/health").then(r=>r.json()).then(d=>setBeatOk(d.status==="ok")).catch(()=>setBeatOk(false));},[]);

  async function uploadFiles(files){const fd=new FormData();files.forEach(f=>fd.append("files",f));const r=await fetch(API+"/api/amv/upload",{method:"POST",body:fd});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"Upload failed");return d.files;}
  async function analyze(fp,s){setAna(true);try{const r=await fetch(API+"/api/amv/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({audio_path:fp,sensitivity:s})});setBD(await r.json());}catch(e){setBD({fallback:true,error:e.message})}finally{setAna(false)}}
  const reanalyze=useCallback(()=>{if(audioFile)analyze(audioFile.path,sensitivity);},[audioFile,sensitivity]);
  async function onAudioChange(e){const files=e.dataTransfer?[...e.dataTransfer.files]:[...e.target.files];if(!files.length)return;e.preventDefault();try{const up=await uploadFiles(files);const af=up.find(f=>f.type==="audio")||up[0];setAF(af);setBD(null);setGRes(null);setSid(null);setScenes([]);setJobId(null);setJobMode("idle");setAudioUrl(null);await analyze(af.path,sensitivity);}catch(err){setErr(err.message)}}
  async function onMediaChange(e){const files=e.dataTransfer?[...e.dataTransfer.files]:[...e.target.files];if(!files.length)return;e.preventDefault();try{const up=await uploadFiles(files);setMF(p=>[...p,...up.filter(f=>f.type!=="audio")]);}catch(err){setErr(err.message)}}

    }catch(e){setErr(e.message);setGProg(0);setGStep(-1);setJobMode("idle");}finally{setGen(false)}}

  async function fetchPlan(){if(!prompt.trim()||planning)return;setPlan(true);setPlanData(null);setErr(null);try{const r=await fetch(API+"/api/video/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt.trim(),duration:aiDur})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"Planning failed");setPlanData(d.plan);}catch(e){setErr(e.message)}finally{setPlan(false)}}
  async function generateAI(){if((!prompt.trim()&&!plan)||aiGenerating)return;setAIG(true);setErr(null);setAIRes(null);setAIStep(0);setAIProg(5);const iv=setInterval(()=>{setAIStep(p=>Math.min(p+1,4));setAIProg(p=>Math.min(88,p+12));},4000);try{const r=await fetch(API+"/api/video/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt.trim(),duration:aiDur,includeAudio:inclAudio,voice,subtitles:inclSubs,approved_plan:plan||null})});clearInterval(iv);const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"Failed");setAIStep(5);setAIProg(100);setAIRes(d);fetch(API+"/api/video/list").then(r=>r.json()).then(d=>setHist(d.videos||[])).catch(()=>{});}catch(e){clearInterval(iv);setErr(e.message);setAIProg(0);setAIStep(-1)}finally{setAIG(false)}}
  const emoSummary=useMemo(()=>{if(!beatData?.drop_emotions)return null;return beatData.drop_emotions.reduce((a,e)=>{a[e]=(a[e]||0)+1;return a},{});},[beatData]);

  if(editorMode&&sessionId&&scenes.length){return(<div className="app"><TimelineEditor sessionId={sessionId} scenes={scenes} totalDur={totalDur} beatData={beatData} audioUrl={audioUrl} options={options} onBack={()=>setEditor(false)} onExportDone={(d)=>{setEditor(false);setGRes({video:d.video,stats:{generationTime:d.exportTime,sceneCount:scenes.length}});fetch(API+"/api/video/list").then(r=>r.json()).then(d=>setHist(d.videos||[])).catch(()=>{});}}/></div>);}

  return(
    <div className="app">
      <header className="header">
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:12}}>
          <div className="logo">✦ Anime Edit Studio</div>
          <button className="btn-s" onClick={()=>setShowSettings(s=>!s)} style={{padding:'4px 10px',fontSize:10}} title="API Key Settings">
            ⚙️ {hasByok?'BYOK ✓':'Settings'}
          </button>
        </div>
        <p className="sub">AI-powered AMV generator · Professional editor · Real-time render</p>

        {showSettings&&(
          <div className="card" style={{maxWidth:500,margin:'12px auto 0',textAlign:'left',background:'var(--surface)',border:'1px solid var(--accent)'}}>
            <div className="clabel">🔑 AI API Keys (BYOK — your keys, your cost)</div>
            <div style={{fontSize:10,color:'var(--text2)',marginBottom:12,lineHeight:1.6}}>
              Keys are stored in your browser only. Never sent to any server database. Without keys, the smart classifier runs locally for free.
            </div>
            <div className="field">
              <label className="lbl">Anthropic API Key (recommended)</label>
              <input className="inp" type="password" value={byokAnthropic} onChange={e=>setByokAnthropic(e.target.value)} placeholder="sk-ant-api03-..." style={{fontSize:11}}/>
            </div>
            <div className="field">
              <label className="lbl">Gemini API Key (free tier available)</label>
              <input className="inp" type="password" value={byokGemini} onChange={e=>setByokGemini(e.target.value)} placeholder="AIza..." style={{fontSize:11}}/>
            </div>
            <div className="field">
              <label className="lbl">OpenAI API Key (fallback)</label>
              <input className="inp" type="password" value={byokOpenai} onChange={e=>setByokOpenai(e.target.value)} placeholder="sk-..." style={{fontSize:11}}/>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-p" onClick={saveByok} style={{flex:1,fontSize:11}}>Save Keys</button>
              <button className="btn-s" onClick={()=>{setByokAnthropic('');setByokGemini('');setByokOpenai('');localStorage.removeItem('byok_anthropic');localStorage.removeItem('byok_gemini');localStorage.removeItem('byok_openai');}} style={{padding:'8px 14px',fontSize:10}}>Clear All</button>
            </div>
            <div style={{marginTop:8,fontSize:9,color:'var(--text3)',lineHeight:1.6}}>
              {hasByok
                ?<span style={{color:'var(--green)'}}>✓ AI-enhanced editing enabled via your API key</span>
                :<span>No keys set — using smart classifier (free, no API calls)</span>
              }
            </div>
          </div>
        )}

        <div className="tabs">
          <button className={"tab"+(tab==="amv"?" on":"")} onClick={()=>{setTab("amv");setErr(null)}}>🎵 AMV Studio</button>
          <button className={"tab"+(tab==="ai"?" on":"")} onClick={()=>{setTab("ai");setErr(null)}}>🤖 AI Generator</button>
          <button className={"tab"+(tab==="market"?" on":"")} onClick={()=>{setTab("market");setErr(null)}}>🎬 Marketplace</button>
        </div>
      </header>

      {tab==="amv"&&(
        <div className="gen-layout">
          <div>
            <div className="card"><div className="clabel">🎵 Music Track</div>
              {!audioFile?(<div className="dropzone" onDragOver={e=>e.preventDefault()} onDrop={onAudioChange}><input type="file" accept=".mp3,.wav,.aac,.m4a,.ogg,.flac" onChange={onAudioChange}/><div className="dz-icon">🎧</div><div className="dz-title">Drop your music here</div><div className="dz-sub">MP3, WAV, AAC, FLAC</div></div>
              ):(<div>
                <div style={{display:'flex',alignItems:'center',gap:7,padding:'7px 10px',background:'var(--bg2)',borderRadius:7,border:'1px solid var(--border)'}}>
                  <span style={{fontSize:16}}>🎵</span><div style={{flex:1,minWidth:0}}><div style={{fontSize:11,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{audioFile.originalName}</div><div style={{fontSize:8,color:'var(--text3)',marginTop:1}}>{(audioFile.size/1024/1024).toFixed(1)} MB</div></div>
                  <button className="btn-s" onClick={()=>{setAF(null);setBD(null);setGRes(null);setSid(null);setScenes([]);setJobId(null);setJobMode("idle");setAudioUrl(null)}}>✕</button>
                </div>
                <div style={{marginTop:8}}><label className="lbl">Beat Sensitivity</label><div className="slider-wrap"><span style={{fontSize:9,color:'var(--text3)'}}>Fewer</span><input type="range" className="slider" min={0} max={1} step={0.05} value={sensitivity} onChange={e=>setSens(parseFloat(e.target.value))} onMouseUp={reanalyze} onTouchEnd={reanalyze}/><span style={{fontSize:9,color:'var(--text3)'}}>More</span><span className="slider-val">{Math.round(sensitivity*100)}%</span></div></div>
                {analyzing&&<div style={{fontSize:10,color:'var(--accent2)',marginTop:6,display:'flex',gap:4,alignItems:'center'}}><span className="spinning">⟳</span>Analyzing...</div>}
                {beatData&&!beatData.fallback&&(<><WaveformPreview energy={beatData.energy_curve} beats={beatData.beats} drops={beatData.drops} dropEmotions={beatData.drop_emotions} duration={beatData.duration} bpm={beatData.bpm}/>{emoSummary&&(<div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:6}}>{Object.entries(emoSummary).map(([emo,cnt])=>{const m=EMOTION_META[emo]||EMOTION_META.neutral;return <span key={emo} style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 6px',borderRadius:8,fontSize:8,fontWeight:700,background:m.color+'18',color:m.color,border:'1px solid '+m.color+'33'}}>{m.icon} {m.label} ×{cnt}</span>;})}</div>)}</>)}
                {(beatData?.fallback||beatOk===false)&&<div className="warnbox">⚠ Beat detector offline<br/><code>python3 beat_detector.py</code></div>}
              </div>)}
            </div>
            <div className="card"><div className="clabel">🖼️ Media Files</div>
              <div className="dropzone" onDragOver={e=>e.preventDefault()} onDrop={onMediaChange}><input type="file" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov" multiple onChange={onMediaChange}/><div className="dz-icon">📂</div><div className="dz-title">Photos or video clips</div><div className="dz-sub">JPG, PNG, MP4</div></div>
              {mediaFiles.length>0&&(<div className="mgrid" style={{marginTop:6}}>{mediaFiles.map((f,i)=>(<div key={i} className="mthumb">{f.type==="video"?<video src={API+f.url} muted/>:<img src={API+f.url} alt="" loading="lazy"/>}<div className="num">{i+1}</div>{f.type==="video"&&<div className="vbadge">VID</div>}<button className="rm" onClick={()=>setMF(p=>p.filter((_,j)=>j!==i))}>✕</button></div>))}</div>)}
            </div>
            <div className="card"><div className="clabel">⚙️ Settings</div><div className="row2"><div className="field"><label className="lbl">Max Duration</label><input type="number" className="inp" min={5} max={120} value={maxDur} onChange={e=>setMaxDur(parseInt(e.target.value)||30)} style={{fontSize:11}}/></div><div className="field"><label className="lbl">Aspect Ratio</label><select className="sel" value={ar} onChange={e=>setAR(e.target.value)} style={{fontSize:11}}><option value="9:16">9:16 TikTok</option><option value="16:9">16:9 YouTube</option></select></div></div></div>

            <div className="card">
              <div className="clabel">🎨 Edit Style</div>
              <div style={{fontSize:9,color:'var(--text3)',marginBottom:8,lineHeight:1.6}}>How should the video feel? Overrides the auto emotion detection.</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:5}}>
                {[
                  {id:null,   icon:'🤖',label:'Auto',     desc:'Let beats decide'},
                  {id:'hard_cut',  icon:'⚡',label:'Hard Cut',  desc:'Flash cuts & snap zooms'},
                  {id:'cinematic', icon:'🎬',label:'Cinematic', desc:'Epic & wide graded'},
                  {id:'smooth_flow',icon:'🌊',label:'Smooth',   desc:'Fluid dissolves & breathe'},
                  {id:'emotional', icon:'💙',label:'Emotional', desc:'Slow drifts & blue tones'},
                  {id:'aesthetic', icon:'✨',label:'Aesthetic', desc:'Dreamy glow & pastels'},
                ].map(s=>{
                  const active=editStyle===s.id;
                  return(<button key={s.id||'auto'} onClick={()=>setEditStyle(s.id)}
                    style={{padding:'7px 4px',borderRadius:8,border:'1.5px solid '+(active?'var(--pink)':'var(--border)'),
                      background:active?'rgba(236,72,153,.12)':'transparent',cursor:'pointer',
                      display:'flex',flexDirection:'column',alignItems:'center',gap:2,transition:'all .15s'}}>
                    <span style={{fontSize:18}}>{s.icon}</span>
                    <span style={{fontSize:8,fontWeight:700,color:active?'var(--pink)':'var(--text)'}}>{s.label}</span>
                    <span style={{fontSize:7,color:'var(--text3)',textAlign:'center',lineHeight:1.3}}>{s.desc}</span>
                  </button>);
                })}
              </div>
              {editStyle&&options?.edit_styles?.[editStyle]&&(
                <div style={{marginTop:8,padding:'6px 8px',borderRadius:6,background:'rgba(236,72,153,.06)',fontSize:8,color:'var(--text2)',lineHeight:1.7}}>
                  <b style={{color:'var(--pink)'}}>{options.edit_styles[editStyle].label}</b> — {options.edit_styles[editStyle].description}
                </div>
              )}
            </div>

            <div className="card" style={{background:'linear-gradient(135deg,var(--surface) 0%,rgba(139,92,246,.06) 100%)'}}>
              <div className="clabel">🚀 Create</div>
              <button className={"btn btn-p"+(isWorking?" gen-pulse":"")} style={{background:'linear-gradient(135deg,var(--accent) 0%,var(--pink) 100%)',fontSize:13,padding:'14px 16px'}} onClick={handleGenerate} disabled={!canGenerate||isWorking}>
                {isWorking?(jobMode==="rendering"?"⏳ AI Rendering Scenes...":"🤖 AI Analyzing..."):"🎬 Generate AMV"}
              </button>
              <div style={{fontSize:9,color:'var(--text3)',textAlign:'center',marginTop:6,lineHeight:1.6}}>{canGenerate?(editStyle?`Style: ${options?.edit_styles?.[editStyle]?.label||editStyle} · AI renders all scenes`:"AI analyzes beats → picks compositions, effects, transitions → renders all scenes"):"Upload music + media to enable"}</div>
            </div>
          </div>

          <div>
            {currentJobId&&jobMode==="rendering"&&(<SSEProgress jobId={currentJobId} onReady={onSessionReady}/>)}
            {generating&&!currentJobId&&(<div className="card fade-in"><div className="clabel">⏳ AI Editor Working</div><div className="pbg"><div className="pfill" style={{width:genProg+"%"}}/></div>{GEN_STEPS.map((s,i)=>(<div key={s.id} className={"steprow"+(i===genStep?" active":i<genStep?" done":"")}><span style={{width:14}}>{i<genStep?"✅":i===genStep?s.i:"⏳"}</span>{s.l}</div>))}</div>)}
            {error&&<div className="err fade-in"><span>❌</span><div style={{flex:1}}>{error}</div></div>}

            {jobMode==="done"&&sessionId&&scenes.length>0&&!genResult?.video&&(
              <div className="fade-in"><div className="card" style={{textAlign:'center',background:'linear-gradient(135deg,var(--surface) 0%,rgba(52,211,153,.05) 100%)',border:'1px solid rgba(52,211,153,.2)'}}>
                {autoExporting?(<>
                  <div style={{fontSize:30,marginBottom:8}} className="spinning">⟳</div>
                  <div style={{fontSize:16,fontWeight:700,marginBottom:6,color:'var(--accent2)'}}>Exporting Video...</div>
                  <div style={{fontSize:12,color:'var(--text2)',marginBottom:14}}>Combining {scenes.length} scenes with audio into final video</div>
                  <div className="pbg" style={{maxWidth:300,margin:'0 auto'}}><div className="pfill" style={{width:'60%'}}/></div>
                </>):(<>
                  <div style={{fontSize:40,marginBottom:8}}>✅</div>
                  <div style={{fontSize:16,fontWeight:700,marginBottom:6,color:'var(--green)'}}>Generation Complete!</div>
                  <div style={{fontSize:12,color:'var(--text2)',marginBottom:14,lineHeight:1.6}}>AI editor created <b style={{color:'var(--text)'}}>{scenes.length} scenes</b> with compositions, effects, transitions, and color grading.</div>
                </>)}
                <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'center',marginBottom:16}}>
                  {scenes.filter(s=>s.composition).length>0&&<span style={{fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:12,background:'rgba(34,211,238,.1)',color:'var(--cyan)',border:'1px solid rgba(34,211,238,.2)'}}>🎬 {scenes.filter(s=>s.composition).length} compositions</span>}
                  {scenes.filter(s=>s.editSource==='llm').length>0&&<span style={{fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:12,background:'rgba(139,92,246,.1)',color:'var(--accent2)',border:'1px solid rgba(139,92,246,.2)'}}>🤖 {scenes.filter(s=>s.editSource==='llm').length} AI-advised</span>}
                  <span style={{fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:12,background:'rgba(251,191,36,.1)',color:'var(--amber)',border:'1px solid rgba(251,191,36,.2)'}}>⏱ {totalDur.toFixed(1)}s</span>
                </div>
                {!autoExporting&&<button className="btn btn-p" onClick={()=>setEditor(true)} style={{background:'linear-gradient(135deg,var(--accent) 0%,var(--pink) 100%)',maxWidth:340,margin:'0 auto',fontSize:13,padding:'13px 20px'}}>🎛 Open Timeline Editor</button>}
                {!autoExporting&&<div style={{fontSize:9,color:'var(--text3)',marginTop:8}}>Video is exporting... or open editor now</div>}
              </div></div>
            )}

            {genResult?.video&&(<div className="fade-in"><div className="card" style={{padding:0,overflow:'hidden'}}><div className="vwrap" style={{border:'none'}}><video src={API+genResult.video.url} controls autoPlay playsInline/><div className="vmeta"><div className="vtags">{genResult.stats?.generationTime&&<span className="vtag" style={{background:'rgba(139,92,246,.1)',color:'var(--accent2)'}}>⏱ {genResult.stats.generationTime}</span>}{genResult.stats?.sceneCount&&<span className="vtag" style={{background:'rgba(52,211,153,.1)',color:'var(--green)'}}>🎬 {genResult.stats.sceneCount} scenes</span>}</div><a href={API+genResult.video.url} download className="dl">↓ Download</a></div></div></div>
              {sessionId&&scenes.length>0&&(<div className="card" style={{textAlign:'center'}}><div style={{fontSize:13,fontWeight:700,marginBottom:6}}>Fine-tune?</div><button className="btn btn-p" onClick={()=>setEditor(true)} style={{maxWidth:320,margin:'0 auto'}}>🎛 Open Timeline Editor</button></div>)}
            </div>)}

            {!genResult&&!generating&&jobMode==="idle"&&(<div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:350,color:'var(--text3)',flexDirection:'column',gap:12}}><span style={{fontSize:48,opacity:.5}}>🎬</span><span style={{fontSize:13,fontWeight:500}}>Upload music + photos, then hit Generate</span><span style={{fontSize:10,maxWidth:380,textAlign:'center',lineHeight:1.7}}>The AI editor analyzes beats, picks compositions, effects, transitions, and color grading for each scene — like a professional human editor. Then fine-tune in the timeline editor.</span></div>)}
          </div>

          <div>
            <div className="card"><div className="clabel">💡 How It Works</div><div style={{fontSize:10,color:'var(--text2)',lineHeight:1.9}}><p><b>1.</b> Upload music + anime images</p><p><b>2.</b> Click <b style={{color:'var(--pink)'}}>Generate AMV</b></p><p style={{paddingLeft:14,fontSize:9,color:'var(--text3)'}}>AI analyzes beats · LLM picks compositions, effects, transitions, grades · renders scenes</p><p><b>3.</b> Review and open editor</p><p style={{paddingLeft:14,fontSize:9,color:'var(--text3)'}}>Audio playback · change per-scene settings · import/export presets</p><p><b>4.</b> Export final video</p></div></div>
            <div className="card"><div className="clabel">🔌 System</div><div className="srow"><span className="slbl">Server</span><span className={"sbadge "+(health?"sok":"serr")}>{health?"Online":"Offline"}</span></div><div className="srow"><span className="slbl">LLM Editor</span><span className={"sbadge "+(health?.config?.llm==="configured"?"sok":"swarn")}>{health?.config?.llm==="configured"?"Ready":"No key"}</span></div><div className="srow"><span className="slbl">Beat detector</span><span className={"sbadge "+(beatOk===null?"swarn":beatOk?"sok":"serr")}>{beatOk===null?"Checking…":beatOk?"Online :5051":"Offline"}</span></div><div className="srow"><span className="slbl">Classifier</span><span className={"sbadge "+(classifierInfo?.type==="ml"?"sok":"swarn")}>{classifierInfo?.type==="ml"?"🧠 ML":"📐 Rules"}</span></div>{dbStats?.enabled&&(<div style={{marginTop:8,fontSize:9,color:'var(--text3)',lineHeight:1.7}}>DB: {dbStats.sessions} sessions · {dbStats.editedScenes} edits<br/>Cache: {dbStats.cacheEntries} · Compositions: {dbStats.compositions}</div>)}</div>
            <div className="card"><div className="clabel">📁 Recent ({history.length})</div>{history.length===0?<div style={{fontSize:9,color:'var(--text3)',textAlign:'center',padding:'10px 0'}}>No videos yet</div>:history.slice(0,8).map((v,i)=>(<div key={i} className="hitem"><div><div className="hname">{v.filename}</div><div className="hdate">{new Date(v.createdAt).toLocaleString()}</div></div><button className="pbtn" onClick={()=>setGRes({video:{url:v.url}})}>▶</button></div>))}</div>
          </div>
        </div>
      )}

      {tab==="ai"&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 280px',gap:14,alignItems:'start',marginTop:18}}>
          <div>
            <div className="card"><div className="clabel">📝 Prompt</div><div className="field"><textarea className="inp ta" rows={3} placeholder="e.g. 'Top 5 anime fights that broke the internet'" value={prompt} onChange={e=>setPrompt(e.target.value)}/><div className="chips">{PROMPTS.map((p,i)=><button key={i} className="chip" onClick={()=>setPrompt(p)}>{p.length>42?p.slice(0,42)+"…":p}</button>)}</div></div><div className="row2"><div className="field"><label className="lbl">Duration</label><input type="number" className="inp" min={5} max={60} value={aiDur} onChange={e=>setAiDur(parseInt(e.target.value)||15)} style={{fontSize:11}}/></div><div className="field"><label className="lbl">Voice</label><select className="sel" value={voice} onChange={e=>setVoice(e.target.value)} style={{fontSize:11}}><option value="male_en">English Male</option><option value="female_en">English Female</option></select></div></div><div style={{display:'flex',gap:14,marginBottom:10}}><label className="chk"><input type="checkbox" checked={inclAudio} onChange={e=>setIA(e.target.checked)}/><span>Narration</span></label><label className="chk"><input type="checkbox" checked={inclSubs} onChange={e=>setIS(e.target.checked)}/><span>Subtitles</span></label></div><div className="row2"><button className="btn btn-p" onClick={fetchPlan} disabled={!prompt.trim()||planning||aiGenerating} style={{fontSize:11}}>{planning?"⟳ Planning...":"📋 Generate Plan"}</button><button className="btn btn-g" onClick={generateAI} disabled={!prompt.trim()||aiGenerating||planning} style={{fontSize:11}}>{aiGenerating?"⏳...":plan?"🚀 With Plan":"🎬 Direct"}</button></div></div>
            {aiGenerating&&(<div className="card fade-in"><div className="clabel">⏳ Generating</div><div className="pbg"><div className="pfill" style={{width:aiProg+"%"}}/></div></div>)}
            {error&&<div className="err fade-in"><span>❌</span><div style={{flex:1}}>{error}</div></div>}
            {aiResult?.video&&(<div className="card fade-in"><div className="clabel">🎬 Result</div><div className="vwrap"><video src={API+aiResult.video.url} controls autoPlay playsInline/></div><div className="vmeta"><div className="vtags">{aiResult.stats?.generationTime&&<span className="vtag" style={{background:'rgba(139,92,246,.1)',color:'var(--accent2)'}}>⏱ {aiResult.stats.generationTime}</span>}</div><a href={API+aiResult.video.url} download className="dl">↓ Download</a></div></div>)}
          </div>
          <div>
            <div className="card"><div className="clabel">🔌 System</div><div className="srow"><span className="slbl">Server</span><span className={"sbadge "+(health?"sok":"serr")}>{health?"Online":"Offline"}</span></div><div className="srow"><span className="slbl">LLM</span><span className={"sbadge "+(health?.config?.llm==="configured"?"sok":"swarn")}>{health?.config?.llm==="configured"?"Ready":"No key"}</span></div><div className="srow"><span className="slbl">TTS</span><span className="sbadge swarn">:5050</span></div></div>
            <div className="card"><div className="clabel">📁 Recent ({history.length})</div>{history.slice(0,6).map((v,i)=>(<div key={i} className="hitem"><div><div className="hname">{v.filename}</div></div><button className="pbtn" onClick={()=>setAIRes({video:{url:v.url}})}>▶</button></div>))}</div>
          </div>
        </div>
      )}

      {tab==="market"&&<MarketplaceTab/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
